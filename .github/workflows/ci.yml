name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  format:
    name: 格式规范检查 (cargo fmt)
    runs-on: windows-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Rust 工具链
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: 执行格式检查
        run: cargo fmt --all -- --check

  clippy:
    name: 静态代码分析 (cargo clippy)
    runs-on: windows-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Rust 工具链
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: 运行 Clippy 零警告门禁
        run: cargo clippy --all-targets -- -D warnings

  test-x64:
    name: 功能与回归测试 (x86_64-pc-windows-msvc)
    runs-on: windows-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Rust 工具链
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: 执行全量测试用例
        run: cargo test --all-targets

  check-arm64:
    name: 架构链接检查 (aarch64-pc-windows-msvc)
    runs-on: windows-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Rust 工具链并添加 ARM64 目标
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-pc-windows-msvc

      - name: 检查 ARM64 编译完整性
        run: cargo check --target aarch64-pc-windows-msvc --all-targets

  docs:
    name: 文档仿真构建检查 (cargo doc)
    runs-on: windows-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Rust 工具链
        uses: dtolnay/rust-toolchain@stable

      - name: 构建 API 文档
        run: cargo doc --all-features --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
