[package]
name = "wslcsdk"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Idiomatic, safe, and asynchronous Rust SDK for Microsoft WSL Containers (WSLC)"
readme = "README.md"
documentation = "https://docs.rs/wslcsdk"
keywords = ["wsl", "wslc", "wslcsdk", "container", "virtualization"]
categories = ["virtualization", "os::windows-apis", "api-bindings"]
include = [
    "src/**/*",
    "Cargo.toml",
    "README.md",
]

[dependencies]
wslcsdk-sys = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_Threading",
    "Win32_Security",
    "Win32_System_LibraryLoader",
] }

[package.metadata.docs.rs]
default-target = "x86_64-pc-windows-msvc"
targets = ["x86_64-pc-windows-msvc", "aarch64-pc-windows-msvc"]
rustdoc-args = ["--cfg", "docsrs"]
