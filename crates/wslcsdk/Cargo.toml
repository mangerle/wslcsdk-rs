[package]
name = "wslcsdk"
version = "0.2.0"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Idiomatic, safe, and asynchronous Rust SDK for Microsoft WSL Containers (WSLC)"
readme = "README.md"
documentation = "https://docs.rs/wslcsdk"
keywords = ["wsl", "wslc", "wslcsdk", "container", "virtualization"]
categories = ["virtualization", "os::windows-apis", "api-bindings"]
include = [
    "src/**/*",
    "examples/**/*",
    "Cargo.toml",
    "README.md",
]

[lints]
workspace = true

[dependencies]
wslcsdk-sys = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
dashmap = { workspace = true }

[dev-dependencies]
# 示例与测试需要多线程运行时及 #[tokio::main] 宏；仅作用于本 crate 的示例与测试，
# 不会向库的使用者传递该特性
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_Threading",
    # `CreateEventW` 的签名含 SECURITY_ATTRIBUTES 参数，故本特性为必需项，
    # 由 `async_ops.rs` 的事件等待测试直接使用。**勿按「零引用」清理**——
    # 该参数出现在类型签名中（而非函数体内），只查调用点会误判为未使用。
    "Win32_Security",
    "Win32_System_LibraryLoader",
    "Win32_Networking_WinSock",
] }

[package.metadata.docs.rs]
default-target = "x86_64-pc-windows-msvc"
targets = ["x86_64-pc-windows-msvc", "aarch64-pc-windows-msvc"]
rustdoc-args = ["--cfg", "docsrs"]
